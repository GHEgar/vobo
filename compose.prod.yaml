name: ${COMPOSE_NOMBRE:-vobo}

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-healthcheck: &healthcheck
  interval: 30s
  timeout: 5s
  retries: 3
  start_period: 15s

services:
  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-}
    environment:
      - DOMINIO=${DOMINIO:?}
      - VM_IP=${VM_IP:?}
      - CONTENIDO_FUENTE=${CONTENIDO_FUENTE:-archivos}
    ports:
      - '${NGINX_BIND_ADDR:?}:${NGINX_PORT:?}:8080'
    volumes:
      - ${CONTENIDO_DIR:-./ejemplo/contenido}/media:/usr/share/nginx/media-archivos:ro
      - media:/usr/share/nginx/media-base:ro
      - ${TEMA_DIR:-./frontend/public/tema}:/usr/share/nginx/html/tema:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1:8080/health']
    restart: unless-stopped
    logging: *logging

  backend:
    build:
      target: production
      args:
        APP_VERSION: ${APP_VERSION:-}
    expose:
      - '8000'
    restart: unless-stopped

volumes:
  datos:
    name: ${VOLUMEN_DATOS:-vobo_datos}
  evidencias:
    name: ${VOLUMEN_EVIDENCIAS:-vobo_evidencias}
  media:
    name: ${VOLUMEN_MEDIA:-vobo_media}
