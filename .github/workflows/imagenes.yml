name: imagenes

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: Tag ya existente a publicar, p. ej. v0.3.0
        required: true

permissions:
  contents: read

concurrency:
  group: imagenes-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag || github.ref_name }}
  REGISTRO: ghcr.io/ghegar

jobs:
  verificar:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      corto: ${{ steps.version.outputs.corto }}
      revision: ${{ steps.version.outputs.revision }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.TAG }}

      - name: Version del tag, package.json y CHANGELOG
        id: version
        run: |
          version="${TAG#v}"
          [[ "$TAG" == v* && $version =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] \
            || { echo "::error::$TAG no es vX.Y.Z"; exit 1; }
          paquete=$(jq -r .version frontend/package.json)
          bloqueo=$(jq -r .version frontend/package-lock.json)
          publicada=$(grep -m1 -oP '^## \[\K[0-9][^]]*(?=\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$)' docs/CHANGELOG.md || true)
          fallas=0
          [ "$paquete" = "$version" ] || { echo "::error::frontend/package.json dice $paquete y el tag $version"; fallas=1; }
          [ "$bloqueo" = "$version" ] || { echo "::error::frontend/package-lock.json dice $bloqueo y el tag $version"; fallas=1; }
          [ "$publicada" = "$version" ] || { echo "::error::la ultima version publicada del CHANGELOG es ${publicada:-ninguna} y el tag $version"; fallas=1; }
          [ "$fallas" -eq 0 ] || exit 1
          prerelease=false
          [[ $version == *-* ]] && prerelease=true
          {
            echo "version=$version"
            echo "prerelease=$prerelease"
            echo "corto=$(git rev-parse --short=7 HEAD)"
            echo "revision=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"

  imagenes:
    needs: verificar
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - nombre: vobo-backend
            contexto: ./backend
            dockerfile: ./backend/Dockerfile
            target: production
            descripcion: VoBo API (FastAPI, SQLite and Alembic migrations on start)
          - nombre: vobo-web
            contexto: .
            dockerfile: ./nginx/Dockerfile
            target: ''
            descripcion: VoBo web (React build served by unprivileged nginx, proxies /api to the backend)
    env:
      OCI: |
        org.opencontainers.image.title=${{ matrix.nombre }}
        org.opencontainers.image.description=${{ matrix.descripcion }}
        org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
        org.opencontainers.image.licenses=AGPL-3.0-only
        org.opencontainers.image.version=${{ needs.verificar.outputs.version }}
        org.opencontainers.image.revision=${{ needs.verificar.outputs.revision }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.TAG }}

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadatos
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ${{ env.REGISTRO }}/${{ matrix.nombre }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ needs.verificar.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.verificar.outputs.version }},enable=${{ needs.verificar.outputs.prerelease == 'false' }}
            type=raw,value=latest,enable=${{ needs.verificar.outputs.prerelease == 'false' }}
            type=raw,value=sha-${{ needs.verificar.outputs.corto }}
          labels: ${{ env.OCI }}
          annotations: ${{ env.OCI }}

      - name: Construir y publicar
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: ${{ matrix.contexto }}
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: APP_VERSION=${{ needs.verificar.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha,scope=${{ matrix.nombre }}
          cache-to: type=gha,mode=max,scope=${{ matrix.nombre }}

  release:
    needs: [verificar, imagenes]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.verificar.outputs.version }}
      PRERELEASE: ${{ needs.verificar.outputs.prerelease }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.TAG }}

      - name: Kit de instalacion
        run: make kit version="$VERSION" KIT_DIR=dist

      - name: Notas desde el CHANGELOG
        run: |
          awk -v v="$VERSION" 'index($0, "## [" v "]") == 1 { on = 1; next } on && /^## \[/ { exit } on' docs/CHANGELOG.md > notas.md
          [ -s notas.md ] || { echo "::error::el CHANGELOG no tiene notas para $VERSION"; exit 1; }
          {
            printf '\n---\n\n'
            printf "\`%s/vobo-backend:%s\` · \`%s/vobo-web:%s\` · \`vobo-kit-%s.tar.gz\`\n" \
              "$REGISTRO" "$VERSION" "$REGISTRO" "$VERSION" "$VERSION"
          } >> notas.md

      - name: Release de GitHub
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            extra=()
            [ "$PRERELEASE" = 'true' ] && extra+=(--prerelease)
            gh release create "$TAG" dist/* --verify-tag --title "VoBo $VERSION" --notes-file notas.md "${extra[@]}"
          fi
